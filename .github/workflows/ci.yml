name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    # The curl-cffi-node native binding fails to load on Linux runners
    # (unresolved libidn2 symbol), so the test job runs on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: bun run check

      - name: Test
        run: bun test
